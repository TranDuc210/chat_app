<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat nhe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Man hinh dang nhap -->
  <div id="login">
    <form id="loginForm">
      <h2>Vao chat</h2>
      <input id="nameInput" placeholder="Ten cua ban" maxlength="20" required>
      <button>Tham gia</button>
    </form>
  </div>

  <!-- Giao dien chinh -->
  <div id="app" class="hidden">
    <aside id="rooms">
      <div class="title">PHONG</div>
      <ul id="roomList"></ul>
      <button id="addRoomBtn" type="button">+ Tao phong</button>
    </aside>

    <main>
      <header>
        <button id="menuBtn" type="button" class="icon">☰</button>
        <span id="roomTitle"># chung</span>
        <button id="usersBtn" type="button" class="icon">👥</button>
      </header>
      <div id="messages"></div>
      <form id="msgForm">
        <input id="msgInput" placeholder="Nhap tin nhan..." maxlength="500" autocomplete="off">
      </form>
    </main>

    <aside id="users">
      <div class="title">ONLINE</div>
      <ul id="userList"></ul>
    </aside>

    <!-- Lop toi phia sau ngan keo (chi dung tren dien thoai) -->
    <div id="backdrop" class="hidden"></div>
  </div>

  <!-- Hop tao phong moi -->
  <div id="roomModal" class="hidden">
    <form id="newRoomForm">
      <h3>Tao phong moi</h3>
      <input id="newRoomInput" placeholder="Ten phong" maxlength="20" autocomplete="off">
      <input id="newRoomPass" type="password" placeholder="Mat khau (co the bo trong)" maxlength="50" autocomplete="new-password">
      <div class="row">
        <button type="button" id="cancelRoomBtn" class="gray">Huy</button>
        <button>Tao</button>
      </div>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
